models:


# ------------------------------------------

  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments: 
            min_row_count: 1000
          # config: 
          #   severity: warn  # we can add it here or directly in custom generic test also if we want we can override by writing seviarity over here 
          # Don't assume that every dbt constraint is automatically enforced in every situation.
          # dbt's constraint behavior depends on the constraint type, materialization, and adapter/database capabilities.

    columns:
      - name: listing_id
        description: Primary key for the listing 
        data_tests:  # earlier it was called tests now its depricated , still works
         - unique
         - not_null

      - name: host_id
        description: The hosts's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt', 'Private room', 'Shared room', 'Hotel room'] 

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed_minimum_nights")}}'
        data_tests:
          - positive_values
# ------------------------------------------

  - name: dim_hosts_cleansed
    description: Cleansed table for the Airbnb hosts
    config:
      contract: 
        enforced: true
   
    columns:

      - name: host_id
        description: The id of the host. This is the primary key.
        data_type: integer
        constraints:
          - type: not_null
        data_tests:
          - unique
          # - not_null  # as we have constraint for not_null so no need of it

      - name: host_name
        description: The name of the host.
        data_type: string
        constraints:
          - type: not_null
        # data_tests:
        #   - not_null

      - name: is_superhost
        description: Defines whether the hosts is a superhost.
        data_type: string
        data_tests:
          - accepted_values:
              arguments: 
                values: ['t','f']

      - name: updated_at
        description: tells the updated time of data
        data_type: timestamp

      - name: created_at
        description: tells the created time of data
        data_type: timestamp 

# ------------------------------------------

  - name: dim_listings_w_hosts
    description: Cleansed table for the Airbnb listings with hosts

    tests:

      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
           compare_model: source('airbnb' , 'listings')
            # group_by: [col1, col2] # (Optional)
            # compare_group_by: [col1, col2] # (Optional)
            # factor: 1 # (Optional)
            # row_condition: "id is not null" # (Optional)
            # compare_row_condition: "id is not null" # (Optional)

    columns:

      - name: price

        tests:

          - dbt_expectations.expect_column_values_to_be_of_type:
              arguments:
                column_type: number

          - dbt_expectations.expect_column_quantile_values_to_be_between: 
               arguments:
                quantile: .99
                min_value: 50
                max_value: 500
                # group_by: [group_id, other_group_id, ...] # (Optional)
                # row_condition: "id is not null" # (Optional)
                # strictly: false # (Optional. Default is 'false'. Adds an 'or equal to' to the comparison operator for min/max)
                
          - dbt_expectations.expect_column_max_to_be_between:
              arguments: 
                # min_value: 1 # (Optional)
                max_value: 5000 # (Optional)
                config:
                  severity: warn
                # group_by: [group_id, other_group_id, ...] # (Optional)
                # row_condition: "id is not null" # (Optional)
                # strictly: false # (Optional. Default is 'false'. Adds an 'or equal to' to the comparison operator for min/max)


# ------------------------------------------
  - name: fct_reviews
    columns:
      - name: listing_id
        description: 
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id
      
      - name: reviewer_name
        description: 
        data_tests:
          - not_null

      - name: review_sentiment
        description: 
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']



# ------------------------------------------